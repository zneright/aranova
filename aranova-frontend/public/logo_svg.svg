<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    @keyframes dashTrack {
      0% { stroke-dashoffset: 260; }
      30% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes slideBridge {
      0% { stroke-dashoffset: 140; }
      25% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .logo-track-left {
      stroke-dasharray: 260;
      stroke-dashoffset: 0;
      animation: dashTrack 8s infinite ease-in-out;
    }
    .logo-track-right {
      stroke-dasharray: 260;
      stroke-dashoffset: 0;
      animation: dashTrack 8s infinite ease-in-out;
      animation-delay: 0.4s;
    }
    .logo-bridge {
      stroke-dasharray: 140;
      stroke-dashoffset: 0;
      animation: slideBridge 8s infinite ease-in-out;
    }
  </style>
  <path class="logo-track-left" d="M 160 380 L 256 160" fill="none" stroke="#FFE600" stroke-width="52" stroke-linecap="round" />
  <path class="logo-track-right" d="M 352 380 L 256 160" fill="none" stroke="#10B981" stroke-width="52" stroke-linecap="round" />
  <path class="logo-bridge" d="M 195 290 L 317 290" fill="none" stroke="#FF6B00" stroke-width="52" stroke-linecap="round" />
</svg>
